# ─────────────────────────────────────────────────────────────
#  Vireon Wild Harvest — configuration
#  Part of the Vireon plugin series by ArtsyStudios
#  https://artsystudios.nl
# ─────────────────────────────────────────────────────────────

# Enable verbose debug logging in console.
debug: false

# Language code for plugin messages. Only "en" is shipped today.
language: en

# ─── Mob conversion ──────────────────────────────────────────
mobs:
  enabled: true
  auto-convert-natural: true

  conversions:

    ZOMBIE:
      id: brown_bear
      display-name: "&6Brown Bear"
      sun-immune: true
      health: 40.0
      damage: 7.0
      speed-multiplier: 1.15
      suppress-vanilla-drops: true
      drops:
        - item: BEEF
          id: bear_meat_raw
          name: "&fRaw Bear Meat"
          lore:
            - "&7Hearty, gamey, stringy."
            - "&7Cook it over a fire."
          min: 2
          max: 5
          chance: 1.0
        - item: LEATHER
          id: bear_hide
          name: "&fBear Hide"
          lore:
            - "&7Thick. Rugged. Useful."
          min: 1
          max: 2
          chance: 1.0
        - item: BONE
          id: bear_claw
          name: "&fBear Claw"
          lore:
            - "&7Curved and razor-sharp."
            - "&7A trophy worth keeping."
          min: 0
          max: 3
          chance: 0.4

# ─── Resource pack (Vireon Forge) ────────────────────────────
# Auto-host the generated resource pack via a built-in HTTP server.
#
# How it works:
#  1. Plugin scans /plugins/VireonWildHarvest/forge/ for model folders.
#  2. Each folder (named after a drop's id) should contain:
#       - model.json   : Blockbench export (File → Export → Generic Model — Item)
#       - texture.png  : the model's PNG texture
#     A placeholder magenta-checker model is auto-created the first time
#     so the plugin works out of the box without crashes.
#  3. The plugin builds the pack zip, hashes it, and serves it over HTTP
#     on the port below.
#  4. Joining players auto-download it. Reload with /vireon forge reload.
resource-pack:
  enabled: true

  # Bind address. 0.0.0.0 = listen on every interface (recommended).
  host: 0.0.0.0
  port: 8200

  # IMPORTANT — what your players' clients will use to fetch the pack.
  # Must be reachable from the public internet (or your players' LAN, if
  # you're not running publicly). Example values:
  #   "play.myserver.com"        → http://play.myserver.com:8200/vireon-pack.zip
  #   "12.34.56.78:8200"         → http://12.34.56.78:8200/vireon-pack.zip
  #   "http://my-cdn.com/files"  → http://my-cdn.com/files/vireon-pack.zip
  # If left blank, the plugin still builds the pack but does NOT send it to
  # players — fine for local testing without exposing a port.
  public-address: ""

  # Kick players who refuse the pack.
  required: true

  # Prompt text players see in the accept dialog. & color codes work.
  prompt: "&aPlease accept the Vireon resource pack to see custom wildlife."
